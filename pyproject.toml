[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pivotcut"
version = "0.1.0"
description = "2D cut-out animation desktop app (Pivot Animator-inspired, modern)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]
# Only needed to actually call AnthropicAIAnimator/OpenAIAnimator
# (pivotcut.services.ai_animator) — the rest of the app, including its
# test suite, never imports either package. See that module's docstring.
ai = [
    "anthropic>=0.40",
    "openai>=1.50",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pivotcut"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
